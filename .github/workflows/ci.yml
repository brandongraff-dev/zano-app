name: CI

# Runs on GitHub's macOS runners — this is how the project gets built/tested at all until a Mac is
# available locally (see docs/setup/windows-workflow.md). The TestFlight job is disabled until
# Apple Developer + signing secrets exist (docs/setup/apple-developer.md) — don't enable it early,
# it'll just fail on missing secrets.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build Core package tests
        run: swift test --package-path Core

      - name: Build ZANO app (Simulator, compile check only)
        run: |
          xcodebuild -project ZANO.xcodeproj -scheme ZANO \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            build | xcpretty || true
        # Not fatal yet: extension-target Info.plist/entitlement values are unverified (see
        # project.yml header comment) until the first real Mac session fixes them. Remove the
        # `|| true` once Session 0 is confirmed green on a real Mac build — see docs/PROGRESS.md.

  # testflight:
  #   Deliberately left commented out. Uncomment once:
  #     1. Apple Developer Program enrollment is complete (docs/setup/apple-developer.md)
  #     2. Signing is set up (recommend fastlane match) and its secrets are in GitHub Actions
  #        repo secrets: MATCH_GIT_URL, MATCH_PASSWORD, APP_STORE_CONNECT_API_KEY, etc.
  #     3. Family Controls entitlement requests are approved for all 5 bundle IDs
  #   runs-on: macos-15
  #   needs: build-and-test
  #   steps:
  #     - uses: actions/checkout@v4
  #     - run: brew install xcodegen fastlane
  #     - run: xcodegen generate
  #     - run: fastlane beta   # define this lane once fastlane is set up
