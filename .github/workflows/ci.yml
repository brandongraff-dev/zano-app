name: CI

# Runs on GitHub's macOS runners — this is how the project gets built/tested at all until a Mac is
# available locally (see docs/setup/windows-workflow.md). The `testflight` job below is real
# (fastlane/Fastfile's `beta` lane) but gated off by default via the `ZANO_TESTFLIGHT_ENABLED`
# repository variable, since Apple Developer + signing secrets don't exist yet
# (docs/setup/apple-developer.md, docs/PROGRESS.md) — flipping that one variable to "true" once
# they do is the only change needed to turn it on; see the `testflight` job's own comment below for
# exactly which secrets that requires first.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Cheap, fast, and catches a real class of bug: developer text ("(spec §5.10)") reaching users.
      - name: Lint user-facing strings (no spec references)
        run: |
          HITS=$(grep -rnE '"[^"]*(§|docs/spec)[^"]*"' --include=*.swift App Core/Sources Extensions Watch             | grep -vE '^[^:]+:[0-9]+:[[:space:]]*//'             | grep -vE 'Logger|logger\.|///|assert|fatalError|precondition|#Preview' || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::A user-facing string contains a spec reference (§ or docs/spec). Remove it."
            exit 1
          fi
          echo "no spec references in user-facing strings"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version

      # Everything here targets the iOS Simulator SDK. `swift test --package-path Core` was the
      # original step and cannot work: it builds for the macOS host, where iOS-only frameworks
      # (ActivityKit, FamilyControls, ...) do not exist. Core declares platforms: [.iOS(.v17)].
      #
      # Failures are NOT hidden: no `|| true`. Full logs are uploaded, and the summary step prints
      # a deduplicated error list so a failing run can be diagnosed from `gh run view --log`.
      - name: Build ZANO app (iOS Simulator; compiles Core and every extension target)
        id: build
        run: |
          set -o pipefail
          xcodebuild -project ZANO.xcodeproj -scheme ZANO \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Run Core unit tests (iOS Simulator)
        id: tests
        if: always()
        working-directory: Core
        run: |
          set -o pipefail
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']))")
          echo "Using simulator $SIM_ID"
          xcodebuild test -scheme Core \
            -destination "id=$SIM_ID" \
            -derivedDataPath ../build/DerivedDataTests \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee ../test.log

      # Compiles Core's tests AND the UI tests (the ZANO scheme's test action lists both) without
      # running them. Non-blocking for now: the UI flows were written for the free-path paywall and
      # need updating for the hard paywall.
      - name: Compile UI tests (build-for-testing)
        id: uitests
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project ZANO.xcodeproj -scheme ZANO             -destination 'generic/platform=iOS Simulator'             -derivedDataPath build/DerivedData             CODE_SIGNING_ALLOWED=NO 2>&1 | tee uitests.log

      # Boots a simulator, installs the freshly built app, launches it and photographs the result.
      # continue-on-error: a launch crash or a missing screen must never mask the build/test result.
      # Everything lands in shots/ (screenshots, the app's own log, any crash reports) so a failed
      # launch is diagnosable without a Mac.
      - name: Screenshot tour (iOS Simulator)
        id: shots
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p shots
          APP=$(find build/DerivedData/Build/Products -maxdepth 3 -name "ZANO.app" | head -1)
          echo "APP=$APP"
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          def ver(k):
              import re
              m = re.search(r'iOS-(\d+)-(\d+)', k)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          runtimes = sorted((k for k in data if 'iOS' in k), key=ver, reverse=True)
          for k in runtimes:
              phones = [d for d in data[k] if d['name'].startswith('iPhone')]
              pro = [d for d in phones if d['name'].endswith(' Pro')]
              pick = (pro or phones)
              if pick:
                  print(pick[0]['udid']); break
          ")
          echo "Simulator: $SIM_ID"
          xcrun simctl list devices | grep "$SIM_ID" || true
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b
          xcrun simctl status_bar "$SIM_ID" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$SIM_ID" "$APP"
          xcrun simctl launch "$SIM_ID" com.zano.app || echo "LAUNCH FAILED"
          sleep 8
          xcrun simctl io "$SIM_ID" screenshot shots/00-plain-launch.png
          # One launch per screen: -ZANOScreen <name> is read by ScreenshotGallery.swift, which seeds
          # demo data and renders that screen through the real code paths.
          SCREENS="onboarding-1 onboarding-2 onboarding-3 onboarding-4 onboarding-5 onboarding-6 onboarding-7
                   onboarding-8 onboarding-9 onboarding-10 onboarding-11 onboarding-12 onboarding-13 onboarding-14
                   paywall tab-today tab-lock tab-fuel tab-progress tab-settings
                   locksetup trophy cosmetics sunrise-setup bedtime-setup alarm-ringing"
          for SCREEN in $SCREENS; do
            xcrun simctl terminate "$SIM_ID" com.zano.app 2>/dev/null || true
            xcrun simctl launch "$SIM_ID" com.zano.app -ZANOScreen "$SCREEN" || echo "LAUNCH FAILED: $SCREEN"
            sleep 5
            xcrun simctl io "$SIM_ID" screenshot "shots/$SCREEN.png"
          done
          xcrun simctl spawn "$SIM_ID" log show --style compact --last 3m \
            --predicate 'process == "ZANO"' > shots/app.log 2>&1 || true
          cp ~/Library/Logs/DiagnosticReports/ZANO* shots/ 2>/dev/null || true
          ls -la shots

      # The simulator build itself, for interactive use (e.g. upload the zip to Appetize.io and click
      # through it in a browser). Not a device build: it cannot be installed on a real iPhone.
      - name: Package simulator build
        if: always() && steps.build.outcome == 'success'
        run: |
          cd build/DerivedData/Build/Products/Debug-iphonesimulator
          zip -r -q "$GITHUB_WORKSPACE/ZANO-simulator.zip" ZANO.app

      - name: Upload simulator build
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ZANO-simulator-build
          path: ZANO-simulator.zip
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots
          if-no-files-found: ignore

      - name: Summarize errors (deduplicated)
        if: always()
        run: |
          for f in build.log test.log uitests.log; do
            [ -f "$f" ] || continue
            echo "=================== $f: unique errors ==================="
            grep -E "error:" "$f" | sed -E 's|^.*/zano-app/zano-app/||' | sort -u | head -150
            echo "--- total 'error:' lines: $(grep -cE 'error:' "$f")  unique: $(grep -E 'error:' "$f" | sort -u | wc -l)"
          done

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            test.log
            uitests.log
          if-no-files-found: ignore

  testflight:
    # Gated off by default — this job now runs a real lane (fastlane/Fastfile's `beta`), but every
    # step below short-circuits via the job-level `if:` unless the `ZANO_TESTFLIGHT_ENABLED`
    # repository variable (Settings → Secrets and variables → Actions → Variables tab, NOT
    # Secrets) is set to the exact string "true". A gated-off run shows this job as *skipped*, not
    # failed, so pushes to `main` stay green with zero risk of failing over the still-missing
    # secrets below. Flip the variable on only once ALL of the following are true:
    #   1. Apple Developer Program enrollment is complete (docs/setup/apple-developer.md)
    #   2. Family Controls entitlement requests are approved for all bundle IDs (main app + the 4
    #      extensions that need it — see docs/setup/apple-developer.md)
    #   3. fastlane match is set up (a private cert/profile git repo exists) and these repo
    #      *secrets* (not variables) are all added: APP_STORE_CONNECT_API_KEY, APPLE_TEAM_ID,
    #      MATCH_GIT_URL, MATCH_PASSWORD — see fastlane/Fastfile's header comment for the exact
    #      shape each one needs (APP_STORE_CONNECT_API_KEY in particular is a base64-encoded JSON
    #      blob, not the raw .p8 file).
    # See docs/PROGRESS.md for current status on all of the above.
    runs-on: macos-15
    needs: build-and-test
    if: vars.ZANO_TESTFLIGHT_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen + fastlane
        run: brew install xcodegen fastlane

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build and upload to TestFlight
        run: fastlane beta
        # No Gemfile/Bundler pinning a fastlane version yet — this runs against whatever
        # `brew install fastlane` resolves to at the time. Add a Gemfile + `bundle exec` here if
        # fastlane version drift ever causes a CI break that doesn't reproduce locally.
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
