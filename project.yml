# XcodeGen project definition — https://github.com/yonaskolb/XcodeGen
#
# The .xcodeproj is NOT committed (see .gitignore). Generate it on a Mac with:
#   brew install xcodegen && xcodegen generate
# Never hand-edit the generated .xcodeproj's settings — change this file and regenerate, or your
# change is silently lost next time someone else regenerates.
#
# Status: written from Windows without Xcode to verify against. The extension-target
# NSExtensionPointIdentifier values below are believed correct from Apple's documented Screen
# Time / WidgetKit APIs but are UNVERIFIED — cross-check each one against a freshly-generated
# Xcode template of that extension type the first time this is opened on a Mac. See
# docs/setup/mac-setup.md step 3.

name: ZANO

options:
  bundleIdPrefix: com.zano.app
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone only for v1 — see docs/spec.md §12
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  Core:
    path: Core

targets:
  ZANO:
    type: application
    platform: iOS
    sources:
      # Assets.xcassets (App/ZANO/Assets.xcassets: AppIcon.appiconset + AccentColor.colorset) is
      # deliberately NOT listed as a second `sources:` entry — the line below already picks it up.
      # Reasoning, from XcodeGen's own source-type semantics (checked against the XcodeGen repo's
      # Docs/ProjectSpec.md and SourceGenerator.swift, but NOT against a real `xcodegen generate`
      # run — no Mac exists yet; see docs/setup/mac-setup.md step 2 for the first real check):
      #   * A `- path: App/ZANO` entry with no `type:` is `type: group` (XcodeGen's documented
      #     default for a directory whose name has no file extension) — a recursive GROUP source,
      #     NOT an Xcode "folder reference" (`type: folder`), even though it is easy to read it
      #     as one. It matters: a group source is re-scanned from disk on every
      #     `xcodegen generate`, so a subfolder added since the last run is picked up then.
      #   * During that recursive scan XcodeGen treats a directory that is an Xcode "file wrapper"
      #     (`Xcode.isDirectoryFileWrapper` — a directory whose extension maps to a known Xcode
      #     file type; `.xcassets` -> `folder.assetcatalog` is one) as a single file reference
      #     added to the Resources build phase, instead of recursing into it. So the new
      #     `Assets.xcassets` folder is included automatically as one asset-catalog entry.
      #   * A second explicit entry `- path: App/ZANO/Assets.xcassets` would overlap the recursive
      #     scan above. XcodeGen has no documented duplicate-source-path handling (its
      #     `fileReferencesByPath` cache reuses the file reference, but nothing guarantees it also
      #     de-duplicates the build-phase membership), so an overlap risks a duplicate
      #     "Copy Bundle Resources" entry for the catalog — and nobody can catch that until a Mac
      #     regenerates. Redundant-but-maybe-harmful is the less safe choice; do nothing extra.
      # If a Mac run of `xcodegen generate` ever shows Assets.xcassets missing from the ZANO
      # target's Copy Bundle Resources phase, only then add a second entry (and drop this comment).
      - path: App/ZANO
    dependencies:
      - package: Core
      - target: ZANOWidgets
        embed: true
      - target: ZANOShieldConfig
        embed: true
      - target: ZANOShieldAction
        embed: true
      - target: ZANOMonitor
        embed: true
      - target: ZANOReport
        embed: true
    info:
      path: App/ZANO/Info.plist
      properties:
        # Launch screen: the ZANO wordmark centred on the app background (docs/brand/brand-kit.md).
        UILaunchScreen:
          UIImageName: LaunchLogo
          UIColorName: LaunchBackground
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocationWhenInUseUsageDescription: "ZANO uses your location to verify gym visits so you can earn your apps back."
        NSLocationAlwaysAndWhenInUseUsageDescription: "ZANO uses background location to verify gym visits even when the app isn't open."
        NSHealthShareUsageDescription: "ZANO reads workouts, steps, and sleep to verify goals automatically, without you having to log them."
        NSHealthUpdateUsageDescription: "ZANO may save workouts you start from inside the app."
        NFCReaderUsageDescription: "ZANO reads ZANO tags to log actions like water, protein, or a lock/unlock."
        NSCameraUsageDescription: "ZANO uses your camera to estimate protein from meal photos."
        NSMotionUsageDescription: "ZANO uses motion data to verify workouts and prevent goal spoofing."
        # Background execution the verifiers depend on. Without these declared, iOS never launches
        # or wakes the app for the events below and the verifiers silently never fire:
        #   location            - GymVerifier (Core/Sources/Core/Verification/GymVerifier.swift):
        #                         CLMonitor geofence + dwell tracking, and GymAutoDetect's visit
        #                         monitoring, keep working with the app backgrounded/suspended.
        #   fetch               - periodic background refresh (BGAppRefreshTask / legacy fetch).
        #   remote-notification - silent pushes (aps-environment is already in the entitlements).
        #   processing          - BGProcessingTask work (e.g. sync outbox flush, recap jobs).
        # NOTE: HealthKit has no UIBackgroundModes value. StepsVerifier's HKObserverQuery +
        # enableBackgroundDelivery wakes the app through the
        # `com.apple.developer.healthkit.background-delivery` entitlement instead — added to the
        # entitlements block below for exactly that reason.
        # NOTE: nothing calls BGTaskScheduler.register yet (grep'd Core/ and App/). The moment
        # something does, its task identifiers must ALSO be listed under a
        # `BGTaskSchedulerPermittedIdentifiers` array in this Info block, or the registration
        # traps at launch. Not added here because there are no identifiers to list yet.
        UIBackgroundModes:
          - location
          - fetch
          - remote-notification
          - processing
        # Registers the `zano://` URL scheme (added in the 2026-09-23 wiring-wave review).
        # `ZANOApp`'s `.onOpenURL` -> `AppRouter.handle(url:)` already routes `zano://tag/<uuid>`
        # (NFC tag URLs, spec §6/§14), `zano://goals` / `zano://emergency` (ShieldAction
        # notification taps, `ShieldCopy.DeepLink`) and `zano://today` / `zano://focus/end`
        # (Live Activity / widget links) — but iOS only delivers those URLs to the app when the
        # scheme is declared here, so before this every one of them was a silent no-op.
        CFBundleURLTypes:
          - CFBundleURLName: com.zano.app
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - zano
    entitlements:
      path: App/ZANO/ZANO.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zano.app
        com.apple.developer.family-controls: true
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # Required (iOS 15+) for HKHealthStore.enableBackgroundDelivery(for:frequency:...), which
        # StepsVerifier.startObserving calls. Without it that call fails with an entitlement error
        # (logged, not thrown, by StepsVerifier) and step goals only verify while the app is alive.
        # Part of the HealthKit capability in Xcode ("Background Delivery" checkbox) — needs to be
        # ticked/confirmed on the App ID in the Apple Developer portal when signing is set up
        # (docs/setup/apple-developer.md). UNVERIFIED key spelling — cross-check against the
        # entitlements file Xcode writes when that checkbox is ticked.
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.nfc.readersession.formats:
          - NDEF
        aps-environment: development
    settings:
      base:
        # Icon + accent come from App/ZANO/Assets.xcassets (AppIcon.appiconset, AccentColor.colorset).
        # XcodeGen's own iOS-application preset already defaults ASSETCATALOG_COMPILER_APPICON_NAME
        # to AppIcon; it is set explicitly anyway so the wiring is visible here instead of implicit.
        # GLOBAL_ACCENT_COLOR_NAME is NOT a XcodeGen default — without it the catalog's
        # AccentColor.colorset is not applied as the app's tint (spec §15: #B8FF3C, ONE accent).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Pinned explicitly (added in the 2026-09-23 wiring-wave review). Without it XcodeGen derives
        # `bundleIdPrefix + "." + target name` = "com.zano.app.ZANO" for this target, which breaks
        # two things that already assume the bare "com.zano.app": (1) ZANOWatch below declares
        # `WKCompanionAppBundleIdentifier: com.zano.app` and its own id `com.zano.app.watchkitapp` —
        # a watch app's id must be prefixed by, and its companion key must equal, the iPhone app's
        # id, so the phone <-> watch pairing (and with it every WatchSyncManager message) could never
        # work against "com.zano.app.ZANO"; (2) docs/sessions/00-repo-and-stack-setup.md and
        # docs/setup/apple-developer.md record `com.zano.app` as THE app id (register it, file the
        # Family Controls request for it). The extensions keep their derived ids
        # (`com.zano.app.ZANOWidgets`, `.ZANOShieldConfig`, ...): those are correctly prefixed by this
        # id, so they install fine. NOTE they are not the `.widgets`/`.shieldconfig`/... suffixes
        # docs/sessions/00 mentions; whichever spelling is registered in the Apple developer portal
        # must match what is generated here, so reconcile before registering (UNVERIFIED — no Mac).
        PRODUCT_BUNDLE_IDENTIFIER: com.zano.app

  ZANOWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ZANOWidgets
    dependencies:
      - package: Core
    info:
      path: Extensions/ZANOWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Extensions/ZANOWidgets/ZANOWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zano.app

  ZANOShieldConfig:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ZANOShieldConfig
    dependencies:
      - package: Core
    info:
      path: Extensions/ZANOShieldConfig/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: ShieldConfigurationExtension
    entitlements:
      path: Extensions/ZANOShieldConfig/ZANOShieldConfig.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zano.app
        com.apple.developer.family-controls: true

  ZANOShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ZANOShieldAction
    dependencies:
      - package: Core
    info:
      path: Extensions/ZANOShieldAction/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-action-service
          NSExtensionPrincipalClass: ShieldActionExtension
    entitlements:
      path: Extensions/ZANOShieldAction/ZANOShieldAction.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zano.app
        com.apple.developer.family-controls: true

  ZANOMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ZANOMonitor
    info:
      path: Extensions/ZANOMonitor/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: DeviceActivityMonitorExtension
    entitlements:
      path: Extensions/ZANOMonitor/ZANOMonitor.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zano.app
        com.apple.developer.family-controls: true

  ZANOReport:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ZANOReport
    # Core for the shared ScreenTimeSummaryView and the SharedDefaults locked-apps mirror.
    dependencies:
      - package: Core
    settings:
      base:
        # Swift 5 language mode for this one placeholder extension only. CI showed Apple's
        # `DeviceActivityReportScene` protocol requirements are not Swift 6 strict-concurrency clean
        # (main-actor `content` vs. nonisolated requirement; non-Sendable
        # `DeviceActivityResults` passed to `makeConfiguration`). Revisit when the real on-device
        # usage report is built (spec §5.15) or when Apple's SDK catches up.
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
    info:
      path: Extensions/ZANOReport/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.report-extension
          # No NSExtensionPrincipalClass: like WidgetKit, this extension point uses the @main
          # declarative entry point (see Extensions/ZANOReport), not the older NSObject-subclass
          # + principal-class pattern used by ShieldConfig/ShieldAction/Monitor below. Verify on Mac.
    entitlements:
      path: Extensions/ZANOReport/ZANOReport.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zano.app
        com.apple.developer.family-controls: true

  # v3 / speculative scope — docs/spec.md §5.21 ("Apple Watch": complication with rings; start
  # focus/lock from the wrist; workout detection more reliable with HR; haptic "verified" tap on
  # gym dwell) and §11's architecture diagram, which lists "ZANOWatch (watchOS app, v3)" as a
  # sibling of ZANO/ZANOWidgets/etc. Source is a deliberately minimal skeleton — see
  # Watch/ZANOWatch/ — matching the "confirms the target is wired, nothing more" spirit of the
  # Session-0 extension placeholders (e.g. Extensions/ZANOReport/ZANOReportExtension.swift).
  #
  # UNVERIFIED — written on Windows with no Mac/Xcode to generate against or diff. Cross-check
  # every key below against a freshly-generated Xcode "Watch App" target template the first time
  # this is opened on a Mac, same as this file's top-of-file note already asks for the
  # NSExtensionPointIdentifier values above. Known gaps deliberately left for a follow-up pass,
  # not fixed here because they would require touching a target/file this run was not scoped to
  # (see this task's knownIssues in the session report for the fuller version):
  #   1. NOT yet embedded as ZANO's companion. XcodeGen only wires "Embed Watch Content" by
  #      adding `- target: ZANOWatch` / `embed: true` to the *ZANO* target's `dependencies:` list
  #      — there is no equivalent field on the watch target itself, and this run's scope was
  #      explicitly limited to appending this target without touching any existing target block
  #      (ZANO's included). Add that one line to ZANO's `dependencies:` before this will actually
  #      install as a paired companion app; until then `xcodegen generate` produces ZANOWatch as
  #      a standalone, unembedded target.
  #   2. Does NOT depend on `package: Core`. Core/Package.swift's `platforms:` list currently
  #      declares only `.iOS(.v17)` (no `.watchOS`), so Swift Package Manager cannot resolve Core
  #      for a watchOS target yet — adding the dependency here first would fail `xcodegen
  #      generate`/build. Watch/ZANOWatch's Swift files are plain SwiftUI with no Core types for
  #      the same reason; they can't yet read Goal/Streak/Theme/etc.
  #   3. `WKCompanionAppBundleIdentifier` below is set to `com.zano.app`, matching the bundle-ID
  #      scheme recorded in docs/sessions/00-repo-and-stack-setup.md's "Known issues" (itself
  #      already flagged there as a choice, not confirmed against an actual Xcode-resolved bundle
  #      ID). If ZANO's real resolved PRODUCT_BUNDLE_IDENTIFIER ever turns out to differ, this
  #      value must be updated to match exactly, or Xcode will refuse to pair the two apps.
  ZANOWatch:
    type: application
    platform: watchOS
    # watchOS 10 shipped alongside iOS 17, matching this file's existing
    # `IPHONEOS_DEPLOYMENT_TARGET: "17.0"` baseline in `settings.base` above — bump the two
    # together later rather than letting the watch target drift ahead of the phone app alone.
    # "A recent watchOS version" could also reasonably mean whatever is newest at generate time;
    # left at 10.0 for internal consistency until a Mac session confirms the real target SDK.
    deploymentTarget: "10.0"
    sources:
      - path: Watch/ZANOWatch
    settings:
      base:
        # Explicit override: this project's default bundle-id derivation (bundleIdPrefix + target
        # name) would produce "com.zano.app.ZANOWatch", not the ".watchkitapp" convention given
        # for this task.
        PRODUCT_BUNDLE_IDENTIFIER: com.zano.app.watchkitapp
        # Overrides the project-wide `settings.base.TARGETED_DEVICE_FAMILY: "1"` (iPhone-only, see
        # top of this file) for this target only — "4" is Apple Watch's device-family value.
        TARGETED_DEVICE_FAMILY: "4"
    info:
      path: Watch/ZANOWatch/Info.plist
      properties:
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.zano.app
        NSHealthShareUsageDescription: "ZANO reads your heart rate and workouts on your wrist to verify gym visits and focus sessions in real time."
        NSHealthUpdateUsageDescription: "ZANO may save workouts you start from your wrist."
    entitlements:
      path: Watch/ZANOWatch/ZANOWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zano.app
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []

  # UI-test bundle for the ZANO app. Appended after ZANOWatch — no existing target block above was
  # touched to add it (same discipline as the ZANOWatch addition). Mirrors what Xcode's own
  # "UI Testing Bundle" target template produces: product type `bundle.ui-testing`, a dependency
  # on the app under test, and an auto-generated Info.plist.
  #
  # How it is wired, per XcodeGen (Docs/ProjectSpec.md + PBXProjGenerator.swift; UNVERIFIED by an
  # actual `xcodegen generate` run — no Mac yet):
  #   * `dependencies: - target: ZANO` is all that is needed to make ZANO the "Target Application":
  #     for a `bundle.ui-testing` target XcodeGen sets TEST_TARGET_NAME to the first dependency
  #     whose target type is an application, and writes the matching `TestTargetID` into the
  #     project's TargetAttributes. Do not also set TEST_TARGET_NAME by hand.
  #   * `GENERATE_INFOPLIST_FILE: YES` is set explicitly because XcodeGen's `bundle.ui-testing`
  #     setting preset does not set it, and a test bundle with neither an `info:` block nor this
  #     setting fails to code-sign ("target does not have an Info.plist file"). Xcode 13+'s own
  #     template sets it the same way.
  #   * Bundle id is left to XcodeGen's default derivation (bundleIdPrefix + target name =
  #     com.zano.app.ZANOUITests); a UI-test bundle's id has no external meaning.
  #   * No `package: Core` dependency: UI tests drive the app from the outside via XCUIApplication
  #     and never link the app's code, and Core's own unit tests live in the Core package itself.
  #   * Signing: a UI-test runner is a separate signed product, so on a real device it needs the
  #     same development team as ZANO. Nothing sets DEVELOPMENT_TEAM anywhere in this file yet
  #     (see docs/setup/apple-developer.md); Simulator runs need no team.
  # Scenarios come later — ZANOUITests/ZANOUITests.swift is one launch smoke test that proves the
  # target exists, compiles, and can start the app.
  ZANOUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ZANOUITests
    dependencies:
      - target: ZANO
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"      # quoted like ENABLE_USER_SCRIPT_SANDBOXING above, so YAML doesn't turn it into a bool

schemes:
  ZANO:
    build:
      targets:
        ZANO: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        # Was a bare `- Core`. XcodeGen reads a plain string here as a LOCAL project-target name
        # (Docs/ProjectSpec.md "Testable Target Reference": `local: {target-name}`), and Core is a
        # Swift package, not a project target — SpecValidation.validationError(for:
        # TestableTargetReference) returns `invalidSchemeTarget` for a `.local` reference with no
        # matching target, which would abort `xcodegen generate` before it wrote any project. A
        # local package's test target is referenced with the documented `package:` form instead:
        # `package: {local-swift-package-name}/{target-name}` — package `Core` (top-level
        # `packages:` above), test target `CoreTests` (Core/Package.swift). UNVERIFIED on a real
        # generate run; if `xcodegen generate` still rejects this scheme, this is the first place
        # to look.
        - package: Core/CoreTests
        - ZANOUITests
