# XcodeGen project definition — https://github.com/yonaskolb/XcodeGen
#
# The .xcodeproj is NOT committed (see .gitignore). Generate it on a Mac with:
#   brew install xcodegen && xcodegen generate
# Never hand-edit the generated .xcodeproj's settings — change this file and regenerate, or your
# change is silently lost next time someone else regenerates.
#
# Status: written from Windows without Xcode to verify against. The extension-target
# NSExtensionPointIdentifier values below are believed correct from Apple's documented Screen
# Time / WidgetKit APIs but are UNVERIFIED — cross-check each one against a freshly-generated
# Xcode template of that extension type the first time this is opened on a Mac. See
# docs/setup/mac-setup.md step 3.

name: ZANO

options:
  bundleIdPrefix: com.zano.app
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone only for v1 — see docs/spec.md §12
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  Core:
    path: Core

targets:
  ZANO:
    type: application
    platform: iOS
    sources:
      - path: App/ZANO
    dependencies:
      - package: Core
      - target: ZANOWidgets
        embed: true
      - target: ZANOShieldConfig
        embed: true
      - target: ZANOShieldAction
        embed: true
      - target: ZANOMonitor
        embed: true
      - target: ZANOReport
        embed: true
    info:
      path: App/ZANO/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocationWhenInUseUsageDescription: "ZANO uses your location to verify gym visits so you can earn your apps back."
        NSLocationAlwaysAndWhenInUseUsageDescription: "ZANO uses background location to verify gym visits even when the app isn't open."
        NSHealthShareUsageDescription: "ZANO reads workouts, steps, and sleep to verify goals automatically, without you having to log them."
        NSHealthUpdateUsageDescription: "ZANO may save workouts you start from inside the app."
        NFCReaderUsageDescription: "ZANO reads ZANO tags to log actions like water, protein, or a lock/unlock."
        NSCameraUsageDescription: "ZANO uses your camera to estimate protein from meal photos."
        NSMotionUsageDescription: "ZANO uses motion data to verify workouts and prevent goal spoofing."
    entitlements:
      path: App/ZANO/ZANO.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zano.app
        com.apple.developer.family-controls: true
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.nfc.readersession.formats:
          - NDEF
        aps-environment: development

  ZANOWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ZANOWidgets
    info:
      path: Extensions/ZANOWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Extensions/ZANOWidgets/ZANOWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zano.app

  ZANOShieldConfig:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ZANOShieldConfig
    info:
      path: Extensions/ZANOShieldConfig/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: ShieldConfigurationExtension
    entitlements:
      path: Extensions/ZANOShieldConfig/ZANOShieldConfig.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zano.app
        com.apple.developer.family-controls: true

  ZANOShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ZANOShieldAction
    info:
      path: Extensions/ZANOShieldAction/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-action-service
          NSExtensionPrincipalClass: ShieldActionExtension
    entitlements:
      path: Extensions/ZANOShieldAction/ZANOShieldAction.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zano.app
        com.apple.developer.family-controls: true

  ZANOMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ZANOMonitor
    info:
      path: Extensions/ZANOMonitor/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: DeviceActivityMonitorExtension
    entitlements:
      path: Extensions/ZANOMonitor/ZANOMonitor.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zano.app
        com.apple.developer.family-controls: true

  ZANOReport:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ZANOReport
    info:
      path: Extensions/ZANOReport/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.report-extension
          # No NSExtensionPrincipalClass: like WidgetKit, this extension point uses the @main
          # declarative entry point (see Extensions/ZANOReport), not the older NSObject-subclass
          # + principal-class pattern used by ShieldConfig/ShieldAction/Monitor below. Verify on Mac.
    entitlements:
      path: Extensions/ZANOReport/ZANOReport.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zano.app
        com.apple.developer.family-controls: true

  # v3 / speculative scope — docs/spec.md §5.21 ("Apple Watch": complication with rings; start
  # focus/lock from the wrist; workout detection more reliable with HR; haptic "verified" tap on
  # gym dwell) and §11's architecture diagram, which lists "ZANOWatch (watchOS app, v3)" as a
  # sibling of ZANO/ZANOWidgets/etc. Source is a deliberately minimal skeleton — see
  # Watch/ZANOWatch/ — matching the "confirms the target is wired, nothing more" spirit of the
  # Session-0 extension placeholders (e.g. Extensions/ZANOReport/ZANOReportExtension.swift).
  #
  # UNVERIFIED — written on Windows with no Mac/Xcode to generate against or diff. Cross-check
  # every key below against a freshly-generated Xcode "Watch App" target template the first time
  # this is opened on a Mac, same as this file's top-of-file note already asks for the
  # NSExtensionPointIdentifier values above. Known gaps deliberately left for a follow-up pass,
  # not fixed here because they would require touching a target/file this run was not scoped to
  # (see this task's knownIssues in the session report for the fuller version):
  #   1. NOT yet embedded as ZANO's companion. XcodeGen only wires "Embed Watch Content" by
  #      adding `- target: ZANOWatch` / `embed: true` to the *ZANO* target's `dependencies:` list
  #      — there is no equivalent field on the watch target itself, and this run's scope was
  #      explicitly limited to appending this target without touching any existing target block
  #      (ZANO's included). Add that one line to ZANO's `dependencies:` before this will actually
  #      install as a paired companion app; until then `xcodegen generate` produces ZANOWatch as
  #      a standalone, unembedded target.
  #   2. Does NOT depend on `package: Core`. Core/Package.swift's `platforms:` list currently
  #      declares only `.iOS(.v17)` (no `.watchOS`), so Swift Package Manager cannot resolve Core
  #      for a watchOS target yet — adding the dependency here first would fail `xcodegen
  #      generate`/build. Watch/ZANOWatch's Swift files are plain SwiftUI with no Core types for
  #      the same reason; they can't yet read Goal/Streak/Theme/etc.
  #   3. `WKCompanionAppBundleIdentifier` below is set to `com.zano.app`, matching the bundle-ID
  #      scheme recorded in docs/sessions/00-repo-and-stack-setup.md's "Known issues" (itself
  #      already flagged there as a choice, not confirmed against an actual Xcode-resolved bundle
  #      ID). If ZANO's real resolved PRODUCT_BUNDLE_IDENTIFIER ever turns out to differ, this
  #      value must be updated to match exactly, or Xcode will refuse to pair the two apps.
  ZANOWatch:
    type: application
    platform: watchOS
    # watchOS 10 shipped alongside iOS 17, matching this file's existing
    # `IPHONEOS_DEPLOYMENT_TARGET: "17.0"` baseline in `settings.base` above — bump the two
    # together later rather than letting the watch target drift ahead of the phone app alone.
    # "A recent watchOS version" could also reasonably mean whatever is newest at generate time;
    # left at 10.0 for internal consistency until a Mac session confirms the real target SDK.
    deploymentTarget: "10.0"
    sources:
      - path: Watch/ZANOWatch
    settings:
      base:
        # Explicit override: this project's default bundle-id derivation (bundleIdPrefix + target
        # name) would produce "com.zano.app.ZANOWatch", not the ".watchkitapp" convention given
        # for this task.
        PRODUCT_BUNDLE_IDENTIFIER: com.zano.app.watchkitapp
        # Overrides the project-wide `settings.base.TARGETED_DEVICE_FAMILY: "1"` (iPhone-only, see
        # top of this file) for this target only — "4" is Apple Watch's device-family value.
        TARGETED_DEVICE_FAMILY: "4"
    info:
      path: Watch/ZANOWatch/Info.plist
      properties:
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.zano.app
        NSHealthShareUsageDescription: "ZANO reads your heart rate and workouts on your wrist to verify gym visits and focus sessions in real time."
        NSHealthUpdateUsageDescription: "ZANO may save workouts you start from your wrist."
    entitlements:
      path: Watch/ZANOWatch/ZANOWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zano.app
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []

schemes:
  ZANO:
    build:
      targets:
        ZANO: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - Core
